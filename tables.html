<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Table</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }

        table {
            width: 50%;
            border: 1px solid black;
            margin: auto;
            border-collapse: collapse;
            background-color: darkgoldenrod;
        }

        th {
            color: darkcyan;
            padding: 12px 6px;
            text-align: left;
            border: 1px solid black;
        }

        td {
            padding: 12px 6px;
            text-align: left;
            color: darkcyan;
            border: 1px solid black;
        }

        .salary {
            color: purple;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <table>
        <caption></caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>FName</th>
                <th>City</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Jane</td>
                <td>Mwangi</td>
                <td>Nairobi</td>
                <td>21</td>
                <td class="salary">60,000</td>

            </tr>

            <tr>
                <td>Doe</td>
                <td>Njambi</td>
                <td>Nakuru</td>
                <td>19</td>
                <td class="salary">20,000</td>
            </tr>

            <tr>
                <td>April</td>
                <td>Duke</td>
                <td>Kisumu</td>
                <td>20</td>
                <td class="salary">40,000</td>
            </tr>
            <tr>
                <td>Queen</td>
                <td>Beck</td>
                <td>Lagos</td>
                <td>25</td>
                <td class="salary">30,000</td>
            </tr>
            <tr>
                <td>Avril</td>
                <td>Goldberg</td>
                <td>Aston</td>
                <td>22</td>
                <td class="salary">20,000</td>
            </tr>
        </tbody>
    </table>


</body>

</html>
